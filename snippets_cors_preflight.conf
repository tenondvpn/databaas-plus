# CORS 片段，供 /api/shardN/ 各 location 用 include 复用。
# 放在 /etc/nginx/snippets/cors_preflight.conf。
#
# 背景：链节点的 HTTP 服务是 uWS，只注册了 POST 路由。跨域时会出现两种失败：
#
#   1) 带 Authorization 等非简单头 -> 浏览器先发 OPTIONS 预检；
#      节点对 OPTIONS 一律回 404，真正的 POST 根本发不出去。
#   2) 不带自定义头的表单 POST 属于 CORS「简单请求」，POST 会正常发出、
#      节点也回 200，但浏览器发现响应里没有 Access-Control-Allow-Origin，
#      就丢弃整个响应，控制台只报 CORS 错误。
#
# 所以下面这段既要在 OPTIONS 上回 204（解决 1），
# 也要给真正的 POST 响应挂上 ACAO（解决 2）——
# 这也是为什么 CORS 头写在 location 层而不是只写在 if 里。

# 所有响应都带（含 POST）。回显请求方 Origin，比写死 '*' 更稳妥：
# '*' 与带凭据的请求不兼容，回显则两种情况都成立。
add_header 'Access-Control-Allow-Origin'  '$http_origin' always;
add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
add_header 'Access-Control-Allow-Credentials' 'true' always;
add_header 'Access-Control-Max-Age'       '86400' always;
add_header 'Vary'                         'Origin' always;

# 预检就地应答，不透传给节点。
# 注意这里刻意不再写 add_header：本层的 if 内没有 add_header，
# 才会按 nginx 的继承规则沿用 location 层上面那一组头
# （nginx 的规则是「本层有任何 add_header 就不继承上一层」）。
if ($request_method = 'OPTIONS') {
    return 204;
}
