# databaas-plus 站点配置。
#
# 与 chainbaas/nginx_chainbaas.conf 的关键差异：每个 /api/shardN/ 块里加了
# OPTIONS 预处理分支。链节点的 HTTP 服务（uWS）只实现了 POST，收到 OPTIONS
# 会返回 404；浏览器在跨域时先发 OPTIONS，拿到 404 就直接把真正的 POST 拦掉，
# 页面上看到的就是「连接无效 / 404 File Not Found」。
#
# 若能保证页面与接口同源（同一个 host:port），浏览器不会发预处理，这段可以不要；
# 但 databaas-plus 的平台接口在 :27001、静态站点在别的端口，很难保证同源，
# 所以这里统一由 nginx 应答预处理，不再透传给节点。
#
# 部署时把 root 改成实际 dist 目录，并按环境填写各分片节点的内网地址。

server {
    listen 8080;
    server_name _;

    root /root/databaas-plus/dist;
    index index.html;

    # 预处理统一在此收口，各 location 用 include 复用。
    # 把这段放到 /etc/nginx/snippets/cors_preflight.conf 更省事，
    # 若不放文件，就把内联内容粘进每个 location（见下方注释）。
    #
    #   add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    #   add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    #   add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    #   add_header 'Access-Control-Max-Age' '86400' always;
    #   add_header 'Vary' 'Origin' always;
    #   add_header 'Content-Length' 0;
    #   add_header 'Content-Type' 'text/plain charset=UTF-8';
    #   return 204;

    location /api/shard2/ {
        proxy_pass https://192.168.26.203:22001/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        include snippets/cors_preflight.conf;
    }


    location /api/shard3/ {
        proxy_pass https://192.168.26.213:23001/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        include snippets/cors_preflight.conf;
    }


    location /api/shard4/ {
        proxy_pass https://192.168.26.211:24001/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        include snippets/cors_preflight.conf;
    }


    location /api/shard5/ {
        proxy_pass https://192.168.26.204:25001/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        include snippets/cors_preflight.conf;
    }


    location /api/shard6/ {
        proxy_pass https://192.168.26.215:26001/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        include snippets/cors_preflight.conf;
    }


    location / {
        try_files $uri $uri/ /index.html;
    }
}
